<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Penguin Body Outline -->
  <path d="M 50 12 C 34 12 28 26 28 42 C 28 54 22 72 26 84 C 28 88 38 90 50 90 C 62 90 72 88 74 84 C 78 72 72 54 72 42 C 72 26 66 12 50 12 Z" fill="url(#body-grad)" stroke="url(#cyber-grad)" stroke-width="2.5" />

  <!-- Terminal Prompt >_ on Belly -->
  <path d="M 40 45 L 48 53 L 40 61" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <line x1="53" y1="61" x2="62" y2="61" stroke="#34d399" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />

  <!-- Eyes / Cyber Visor -->
  <rect x="36" y="28" width="28" height="6" rx="3" fill="#38bdf8" filter="url(#glow)" />

  <!-- Beak -->
  <polygon points="50,37 44,43 56,43" fill="#fbbf24" />

  <!-- Feet (Waddle) -->
  <ellipse cx="37" cy="88" rx="8" ry="3.5" fill="#f59e0b" />
  <ellipse cx="63" cy="88" rx="8" ry="3.5" fill="#f59e0b" />
</svg>
