<svg width="1200" height="700" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- Title -->
  <text x="50%" y="60" fill="#ffffff" font-size="32" font-family="sans-serif" text-anchor="middle">
    Waddle Security Architecture (Overview)
  </text>

  <!-- User Layer -->
  <rect x="80" y="90" width="1040" height="80" rx="10" fill="#1f6feb" opacity="0.85"/>
  <text x="600" y="140" fill="#ffffff" font-size="22" font-family="sans-serif" text-anchor="middle">
    User Actions (Terminal / Editor / File Tree / Git / AI)
  </text>

  <!-- Backend Layer -->
  <rect x="80" y="190" width="1040" height="80" rx="10" fill="#238636" opacity="0.85"/>
  <text x="600" y="240" fill="#ffffff" font-size="22" font-family="sans-serif" text-anchor="middle">
    Waddle Backend (Rust / Tauri Core)
  </text>

  <!-- FS Guardrail -->
  <rect x="80" y="300" width="320" height="320" rx="10" fill="#30363d"/>
  <text x="240" y="335" fill="#ffffff" font-size="20" font-family="sans-serif" text-anchor="middle">
    FileSystem Guardrails
  </text>

  <text x="100" y="370" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • Block /etc, /usr, /bin, /proc, /sys, /dev, /root
  </text>
  <text x="100" y="400" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • $HOME-only Write Boundary (UID match)
  </text>
  <text x="100" y="430" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • SSH/GPG/Keyring Full Deny
  </text>
  <text x="100" y="460" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • Dangerous Symlink Detection
  </text>
  <text x="100" y="490" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • 500-entry Pagination (DoS Defense)
  </text>

  <!-- Editor -->
  <rect x="440" y="300" width="320" height="320" rx="10" fill="#30363d"/>
  <text x="600" y="335" fill="#ffffff" font-size="20" font-family="sans-serif" text-anchor="middle">
    Hardened Editor
  </text>

  <text x="460" y="370" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • Config-file Focused (YAML/TOML/JSON/.env)
  </text>
  <text x="460" y="400" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • No Root Editing / No Priv Escalation
  </text>
  <text x="460" y="430" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • No Regex Search (ReDoS Defense)
  </text>
  <text x="460" y="460" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • No Smart Indent (Syntax Safety)
  </text>
  <text x="460" y="490" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • AutoSave 6 Generations (0700)
  </text>

  <!-- PTY -->
  <rect x="800" y="300" width="320" height="320" rx="10" fill="#30363d"/>
  <text x="960" y="335" fill="#ffffff" font-size="20" font-family="sans-serif" text-anchor="middle">
    PTY / Terminal Defense
  </text>

  <text x="820" y="370" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • Kernel-cooperative Flow Control (pause/resume)
  </text>
  <text x="820" y="400" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • Memory Cap ~300MB (yes / spam)
  </text>
  <text x="820" y="430" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • 0ms Ctrl+C Queue Purge
  </text>
  <text x="820" y="460" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • Dangerous Command Detection
  </text>
  <text x="820" y="490" fill="#c9d1d9" font-size="16" font-family="sans-serif">
    • UTF-8 Boundary Safe Parser
  </text>

  <!-- AI + Kitty row -->

  <!-- AI -->
  <rect x="80" y="640" width="520" height="40" rx="8" fill="#30363d"/>
  <text x="340" y="665" fill="#c9d1d9" font-size="16" font-family="sans-serif" text-anchor="middle">
    AI Safety: 100% Local (Ollama), Prompt Injection Guard, Sanitized Context, Project/Global Rules
  </text>

  <!-- Kitty -->
  <rect x="600" y="640" width="520" height="40" rx="8" fill="#30363d"/>
  <text x="860" y="665" fill="#c9d1d9" font-size="16" font-family="sans-serif" text-anchor="middle">
    Kitty Sandbox: t=f $HOME/Pictures, t=t Immediate Delete→Base64, t=s Disabled, Size/VRAM Limits
  </text>

</svg>
