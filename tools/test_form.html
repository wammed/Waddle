<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waddle 包括的検証テスト入力フォーム (Test Plan Verification Form)</title>
  <style>
    :root {
      --bg-dark: #080c14;
      --bg-card: rgba(17, 24, 39, 0.85);
      --bg-card-hover: rgba(30, 41, 59, 0.9);
      --border-color: rgba(56, 189, 248, 0.2);
      --border-focus: #00f0ff;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-cyan: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.4);
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --accent-amber: #f59e0b;
      --accent-purple: #a855f7;
      --font-mono: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding: 24px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, #00f0ff, #a855f7);
      color: #080c14;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-field label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .meta-field input, .meta-field select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .meta-field input:focus, .meta-field select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    /* Stats Dashboard */
    .dashboard-bar {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .stat-card.total { border-color: rgba(56, 189, 248, 0.3); }
    .stat-card.passed { border-color: rgba(16, 185, 129, 0.4); }
    .stat-card.failed { border-color: rgba(244, 63, 94, 0.4); }
    .stat-card.skipped { border-color: rgba(245, 158, 11, 0.4); }
    .stat-card.untested { border-color: rgba(148, 163, 184, 0.3); }

    .stat-val {
      font-size: 28px;
      font-weight: 800;
      font-family: var(--font-mono);
      line-height: 1;
      margin-bottom: 6px;
    }

    .stat-card.total .stat-val { color: var(--accent-cyan); }
    .stat-card.passed .stat-val { color: var(--accent-green); }
    .stat-card.failed .stat-val { color: var(--accent-red); }
    .stat-card.skipped .stat-val { color: var(--accent-amber); }
    .stat-card.untested .stat-val { color: var(--text-muted); }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-fill {
      height: 100%;
      transition: width 0.3s ease;
    }

    .progress-fill.pass { background: var(--accent-green); }
    .progress-fill.fail { background: var(--accent-red); }
    .progress-fill.skip { background: var(--accent-amber); }
    .progress-fill.untested { background: rgba(148, 163, 184, 0.2); }

    /* Action bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      min-width: 280px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-box input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .button-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    .btn:hover {
      background: rgba(51, 65, 85, 0.95);
      border-color: var(--border-focus);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .btn.primary {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #080c14;
      border: none;
      font-weight: 700;
    }

    .btn.primary:hover {
      box-shadow: 0 0 16px var(--accent-glow);
      filter: brightness(1.1);
    }

    .btn.danger {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fca5a5;
    }

    .btn.danger:hover {
      background: rgba(244, 63, 94, 0.3);
      border-color: #f43f5e;
    }

    /* Suite Tabs */
    .suite-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: thin;
    }

    .suite-tab {
      background: rgba(17, 24, 39, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .suite-tab:hover {
      background: rgba(30, 41, 59, 0.8);
      color: #fff;
    }

    .suite-tab.active {
      background: rgba(0, 240, 255, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
    }

    .tab-badge {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 11px;
      font-family: var(--font-mono);
    }

    .suite-tab.active .tab-badge {
      background: var(--accent-cyan);
      color: #080c14;
      font-weight: 700;
    }

    /* Test Case List */
    .test-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .test-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(12px);
      transition: all 0.2s ease;
    }

    .test-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(56, 189, 248, 0.3);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .test-card.status-pass { border-left: 4px solid var(--accent-green); }
    .test-card.status-fail { border-left: 4px solid var(--accent-red); }
    .test-card.status-skip { border-left: 4px solid var(--accent-amber); }
    .test-card.status-untested { border-left: 4px solid rgba(148, 163, 184, 0.4); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tc-id {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent-cyan);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .tc-type {
      font-size: 11px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .tc-type.automated {
      background: rgba(168, 85, 247, 0.15);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .tc-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .tc-title-en {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: normal;
    }

    /* Status Buttons */
    .status-buttons {
      display: flex;
      gap: 4px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-btn {
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .status-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .status-btn.active-pass {
      background: var(--accent-green);
      color: #080c14;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
    }

    .status-btn.active-fail {
      background: var(--accent-red);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
    }

    .status-btn.active-skip {
      background: var(--accent-amber);
      color: #080c14;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
    }

    .status-btn.active-untested {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    /* Procedure & Expected Grid */
    .card-body-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13px;
      background: rgba(15, 23, 42, 0.5);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    @media (max-width: 800px) {
      .card-body-grid {
        grid-template-columns: 1fr;
      }
    }

    .grid-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .grid-col-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid-col-content {
      color: #e2e8f0;
    }

    .command-box {
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #04060a;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: #38bdf8;
    }

    .command-text {
      flex: 1;
      overflow-x: auto;
      white-space: nowrap;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }

    .btn-copy:hover {
      background: var(--accent-cyan);
      color: #080c14;
    }

    /* Note Input */
    .note-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .note-input {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .note-input:focus {
      border-color: var(--border-focus);
    }

    /* Modal for Markdown preview */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      width: 100%;
      max-width: 900px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .modal-body {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
    }

    .modal-textarea {
      width: 100%;
      height: 380px;
      background: #080c14;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #38bdf8;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 12px;
      resize: vertical;
      outline: none;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--accent-cyan);
      color: #080c14;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.5);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 2000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="header-top">
        <div class="brand">
          <span class="brand-badge">WADDLE QA</span>
          <h1>🧪 包括的テスト検証入力フォーム (Test Plan Verification)</h1>
        </div>
        <div class="button-group">
          <button class="btn primary" id="btn-export-md">📋 Markdown レポート出力</button>
          <button class="btn" id="btn-export-json">💾 JSON 保存</button>
          <button class="btn" id="btn-import-json">📂 JSON 復元</button>
          <button class="btn danger" id="btn-reset-all">⚠️ 全リセット</button>
          <input type="file" id="json-file-input" accept=".json" style="display: none;">
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-field">
          <label for="exec-date">検証日 (Execution Date)</label>
          <input type="date" id="exec-date">
        </div>
        <div class="meta-field">
          <label for="tester-name">テスター (Tester Name)</label>
          <input type="text" id="tester-name" placeholder="例: Waddle QA Lead">
        </div>
        <div class="meta-field">
          <label for="env-info">検証環境 (Environment)</label>
          <input type="text" id="env-info" placeholder="例: Linux (Ubuntu 22.04, WebKitGTK 4.1, Node 20, Rust 1.75)">
        </div>
        <div class="meta-field">
          <label for="overall-result">総合判定 (Overall Result)</label>
          <select id="overall-result">
            <option value="IN PROGRESS">⏳ 検証中 (IN PROGRESS)</option>
            <option value="PASS">🟢 合格 (PASS - 全件クリア)</option>
            <option value="FAIL">🔴 不合格 (FAIL - 課題あり)</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Dashboard Bar -->
    <div class="dashboard-bar">
      <div class="stat-cards">
        <div class="stat-card total">
          <span class="stat-val" id="stat-total">81</span>
          <span class="stat-label">総テスト件数</span>
        </div>
        <div class="stat-card passed">
          <span class="stat-val" id="stat-passed">0</span>
          <span class="stat-label">合格 (PASS)</span>
        </div>
        <div class="stat-card failed">
          <span class="stat-val" id="stat-failed">0</span>
          <span class="stat-label">不合格 (FAIL)</span>
        </div>
        <div class="stat-card skipped">
          <span class="stat-val" id="stat-skipped">0</span>
          <span class="stat-label">保留 / スキップ</span>
        </div>
        <div class="stat-card untested">
          <span class="stat-val" id="stat-untested">81</span>
          <span class="stat-label">未検証 (PENDING)</span>
        </div>
        <div class="stat-card total">
          <span class="stat-val" id="stat-rate">0%</span>
          <span class="stat-label">合格率 (Pass Rate)</span>
        </div>
      </div>

      <div class="progress-track">
        <div class="progress-fill pass" id="bar-pass" style="width: 0%;"></div>
        <div class="progress-fill fail" id="bar-fail" style="width: 0%;"></div>
        <div class="progress-fill skip" id="bar-skip" style="width: 0%;"></div>
        <div class="progress-fill untested" id="bar-untested" style="width: 100%;"></div>
      </div>
    </div>

    <!-- Controls Bar -->
    <div class="controls-bar">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="🔍 テストID、機能名、検証手順をリアルタイム検索...">
      </div>
      <div class="button-group">
        <button class="btn" id="btn-mark-all-pass">✅ 表示中の全項目を「合格」に設定</button>
      </div>
    </div>

    <!-- Suite Tabs -->
    <div class="suite-tabs" id="suite-tabs">
      <!-- Generated via JS -->
    </div>

    <!-- Test List -->
    <div class="test-list" id="test-list">
      <!-- Generated via JS -->
    </div>
  </div>

  <!-- Markdown Modal -->
  <div class="modal-overlay" id="md-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2 style="font-size: 16px; color: #fff;">📋 エビデンス記録 Markdown レポートプレビュー</h2>
        <button class="btn" id="btn-close-modal" style="padding: 4px 8px;">✕</button>
      </div>
      <div class="modal-body">
        <textarea class="modal-textarea" id="md-preview-text" readonly></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="btn-download-md">💾 .md ファイルをダウンロード</button>
        <button class="btn primary" id="btn-copy-md">📋 クリップボードにコピー</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">メッセージ</div>

  <!-- Shared Test Data & Logic -->
  <script>
    const TEST_SUITES = [
      { id: 0, nameJa: '全スイート (All Suites)' },
      { id: 1, nameJa: 'Suite 1: PTY & コアターミナル基盤' },
      { id: 2, nameJa: 'Suite 2: タブ・10種分割ペイン・セッション永続化' },

      // Suite 8: Security & Defense-in-Depth (15)

      { id: 'TC-SEC-02', suiteId: 8, titleJa: 'ユーザー認証情報 & 秘密鍵保護', titleEn: 'User Credential & Secret Protection', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_safe_read_custom_ssh_keys_and_keyrings', procedureJa: '~/.ssh/id_rsa, ~/.ssh/my_deploy_key (任意の秘密鍵), ~/.gnupg/, ~/.local/share/keyrings/ の読み込みを要求。', expectedJa: '既知ファイル名だけでなく ~/.ssh/ 内の秘密鍵全般および keyring が事前バリデーションで弾かれ、config/known_hosts/*.pub のみ安全に閲覧可能。' },
      { id: 'TC-SEC-03', suiteId: 8, titleJa: 'シェル起動設定ファイル保護', titleEn: 'Shell Profile Protection', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_forbidden_write_prevention', procedureJa: '~/.bashrc, ~/.zshrc, ~/.profile の上書き・削除を要求。', expectedJa: '変更が完全に拒絶され、重要設定の改ざんが防止される。' },

      { id: 'TC-SEC-05', suiteId: 8, titleJa: 'パイプ経由スクリプト実行の検知', titleEn: 'Piped Script Execution Detection', type: 'Automated / Manual', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_is_command_dangerous_detection', procedureJa: 'curl ... | bash, wget ... | python3, python <(...), bash <(...) を含むコマンドを発行。', expectedJa: '危険パターンとして検知され、警告ダイアログが表示される。' },
      { id: 'TC-SEC-06', suiteId: 8, titleJa: 'AI プロンプトインジェクション防御', titleEn: 'AI Prompt Injection Defense', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_sanitize_untrusted_output', procedureJa: '大文字小文字や空白を含む変形タグ `</ Untrusted_Terminal_Output >` を含む出力を生成し Ctrl+K を起動。', expectedJa: '正規表現 `(?i)</?\\s*untrusted_terminal_output\\s*>` により変形タグも完全に安全除去され、LLM へのプロンプト脱出が阻止される。' },
      { id: 'TC-SEC-07', suiteId: 8, titleJa: 'Webview Content Security Policy (CSP)', titleEn: 'Webview Content Security Policy (CSP)', type: 'Manual / Automated', command: 'node scratch/test_security_enhancements.mjs', procedureJa: 'インスペクタコンソールから fetch(\'https://malicious-domain.com\') を実行。またはテストスクリプトで検証。', expectedJa: 'CSP の connect-src 違反としてブラウザエンジンにより通信が遮断される。' },
      { id: 'TC-SEC-08', suiteId: 8, titleJa: 'Tauri Scoped Asset Protocol', titleEn: 'Tauri Scoped Asset Protocol', type: 'Automated', command: 'node scratch/test_security_enhancements.mjs', procedureJa: 'asset://localhost/home/user/.ssh/id_rsa を読み込み要求。またはテストスクリプトで検証。', expectedJa: 'アセットスコープ制限（$CONFIG/waddle, $PICTURE, $DOWNLOAD）によりアクセス拒絶。' },
      { id: 'TC-SEC-09', suiteId: 8, titleJa: 'Kitty ローカルファイルサンドボックス', titleEn: 'Kitty Local File Sandbox ($HOME/Pictures)', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_reject_path_traversal', procedureJa: 't=f で /etc/shadow や ~/.ssh/ を指定。', expectedJa: 'Rust の canonicalize 検証により EACCES で即時ブロックされる。' },
      { id: 'TC-SEC-10', suiteId: 8, titleJa: 'Kitty シンボリックリンク脱出防止', titleEn: 'Kitty Symlink Escape Prevention', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_reject_symlink_escape', procedureJa: '$HOME/Pictures/link -> /etc のシンボリックリンクを作成し t=f で参照。', expectedJa: '正準化後の実パスが許可ディレクトリ外と判定されアクセス拒絶される。' },
      { id: 'TC-SEC-11', suiteId: 8, titleJa: 'Kitty 展開爆弾 (Decompression Bomb) 防護', titleEn: 'Kitty Decompression Bomb Defense', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_reject_decompression_bomb_dimensions', procedureJa: '4096×4096 px 超過や不正な PNG IHDR / JPEG SOF 画像を送信。', expectedJa: 'メモリ展開前にヘッダー検査で検知され即時破棄される。' },
      { id: 'TC-SEC-12', suiteId: 8, titleJa: 'Kitty 累積 Base64 ペイロード制限 (16MB)', titleEn: 'Kitty Cumulative Payload Limit (16MB)', type: 'Automated', command: 'node scratch/test_security_enhancements.mjs', procedureJa: '16MB を超える Base64 データを連続送信。', expectedJa: '上限超過時点でバッファが破棄され、メモリ DoS が阻止される。' },
      { id: 'TC-SEC-13', suiteId: 8, titleJa: 'GitHub リモートホスト厳格検証 & サブドメイン偽装防御', titleEn: 'Strict GitHub Host Validation & Anti-Spoofing', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_is_github_host_strict_domain_validation', procedureJa: 'attacker.com/user/github.com.git や github.com.attacker.com をリモートに設定し操作。', expectedJa: 'is_github_host による厳格なホスト正規化により偽装 URL が即座に拒絶され、不正リモートへのアクセスが遮断される。' },

      { id: 'TC-SEC-19', suiteId: 8, titleJa: '最新クレデンシャル検知・マスク検証 (SecretMasker)', titleEn: 'Modern Credential Masking Engine (SecretMasker)', type: 'Automated / Manual', command: 'python3 scratch/test_masker.py', procedureJa: 'test_masker.py の生成ログ（GitHub Fine-Grained/Classic PAT, AWS Access/Secret Key, OpenAI/Anthropic/Google キー, Slack トークン, JWT, Bearer, 秘密鍵）を出力。', expectedJa: '100% のシークレットが検知され、黒丸マスクまたは固有タグへ置換される。ターミナル PTY 出力ストリームからの平文漏洩がゼロ件となる。' },

      { id: 'TC-SEC-21', suiteId: 8, titleJa: 'セッション履歴 & AI Copilot 送信前サニタイズ', titleEn: 'Session History & AI Copilot Storage Sanitization', type: 'Automated / Manual', command: 'node scratch/test_secret_masker.mjs', procedureJa: '機密文字列を含むコマンド（export GITHUB_TOKEN=ghp_... 等）を実行し、localStorage 保存内容およびエラー修正プロンプトを確認。', expectedJa: '履歴データ保存前および AI プロンプト送信前に maskSecrets が適用され、ストレージへの平文残存や外部 LLM への漏洩が防止される。' },

      { id: 'TC-PERF-05', suiteId: 9, titleJa: '静的解析 & 自動単体テスト全パス', titleEn: 'Automated Tests & Static Lints All Pass', type: 'Automated', command: 'cargo test --manifest-path src-tauri/Cargo.toml && cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets && npm run build', procedureJa: 'cargo test, cargo clippy --all-targets, npm run build を実行。', expectedJa: 'テスト全 24 件パス、Clippy 警告 0 件、TypeScript 型エラー 0 件で完了する。' },

      // Suite 10: Next-Gen Workflow & Productivity (6)
      { id: 'TC-ENH-01', suiteId: 10, titleJa: 'リアルタイム機密情報マスク (SecretMasker)', titleEn: 'Real-Time Terminal Secret Masking (SecretMasker)', type: 'Automated / Manual', command: 'node scratch/test_secret_masker.mjs', procedureJa: '設定で機密情報マスクを有効化し、ターミナル上で GitHub Token (ghp_...) や AWS Access Key (AKIA...)、OpenAI Key (sk-...) などを echo 出力。', expectedJa: '秘密鍵やトークンがターミナル表示時に即座にマスク（***MASKED*** 等）され、画面共有や録画での情報漏洩を防止する。' },
      { id: 'TC-ENH-02', suiteId: 10, titleJa: 'セッション タイムトラベル & スナップショット (Ctrl+Shift+H)', titleEn: 'Session Time Travel & Visual Timeline (Ctrl+Shift+H)', type: 'Manual', procedureJa: 'ターミナルで複数のコマンドを実行後、Ctrl+Shift+H を押下してタイムラインモーダルを開き、過去のスナップショットやコマンド履歴を閲覧・復元。', expectedJa: '各コマンドの実行時刻、終了コード、作業ディレクトリがタイムライン形式で表示され、ワンクリックでコマンド再実行やバッファ確認ができる。' },
      { id: 'TC-ENH-03', suiteId: 10, titleJa: 'リッチデータ ビジュアライザ (Markdown / CSV / JSON プレビュー)', titleEn: 'Rich Data Visualizer (Markdown / CSV / JSON Preview)', type: 'Manual', procedureJa: 'ファイルツリーまたはエディタで Markdown / CSV / JSON ファイルを選択し、右上の「プレビュー」切り替えをクリック。', expectedJa: 'Markdown は見出しやコードブロックが美しくレンダリングされ、CSV はソート・検索可能な表形式、JSON は折りたたみ可能なツリー形式で瞬時にプレビュー表示される。' },
      { id: 'TC-ENH-04', suiteId: 10, titleJa: '自律型 AI エラー監視 & 1-Click クイック修正 (Autonomous Watchdog)', titleEn: 'Autonomous AI Error Watchdog & 1-Click Fix', type: 'Manual', procedureJa: 'ターミナルでエラーとなるコマンド（存在しないブランチへの push や構文エラーのあるスクリプト等）を実行。', expectedJa: '非ゼロ終了ステータスや典型的なエラーメッセージを監視エンジンが検知し、AI による原因診断とワンクリック修正コマンド提案バナーを表示する。' },
      { id: 'TC-ENH-05', suiteId: 10, titleJa: 'ビジュアル パイプライン ビルダー (Ctrl+Shift+P)', titleEn: 'Visual Pipeline Builder & Execution (Ctrl+Shift+P)', type: 'Automated / Manual', command: 'node scratch/test_pipeline_builder.mjs', procedureJa: 'Ctrl+Shift+P でパイプラインビルダーを開き、ビルド・テスト・デプロイ等のコマンドステップを連続登録して「パイプライン実行」をクリック。', expectedJa: '登録されたステップが順次実行され、エラー発生時の停止制御やリアルタイム出力確認がターミナルペインで行える。' },
      { id: 'TC-ENH-06', suiteId: 10, titleJa: 'プロジェクト個別 & グローバル共通 AI ルール連携 (.waddle/ & ~/.config/waddle/)', titleEn: 'Project-Specific & Global Common AI Rules (.waddle/ & ~/.config/waddle/)', type: 'Automated / Manual', command: 'cargo test --manifest-path src-tauri/Cargo.toml test_load_project_rules', procedureJa: '1. リポジトリ内（サブディレクトリ含む）に .waddle/rules_ja.md / rules.md を配置して Ctrl+K を起動。\n2. プロジェクト外 (cd ~) に移動して Ctrl+K を起動。\n3. UI 言語を切り替える。', expectedJa: 'リポジトリ内ではステータスバーに「Private Rules」、ツールチップに「Private Rules JA/US/UK (パス)」が表示され、プロジェクト外では「Global Rules」と「Global Rules JA/US/UK (パス)」が表示される。' },

      // Suite 11: Integrated Automated Test Suite & Security/Regression (5)
      { id: 'TC-INT-01', suiteId: 11, titleJa: 'セキュリティ & 依存関係静的監査 (npm run test:security)', titleEn: 'Security & Dependency Static Audits (npm run test:security)', type: 'Automated', command: 'npm run test:security', procedureJa: 'Gitleaks（平文秘密鍵・APIキー走査）、Secretlint（コードベース走査）、cargo-audit（RUSTSEC 脆弱性）、cargo-deny（ライセンス・重複バージョン）を実行。', expectedJa: '機密漏洩 0 件、既知脆弱性 0 件、全依存ライセンスが OSS 許容リストに合致し、全検査が正常終了する。' },
      { id: 'TC-INT-02', suiteId: 11, titleJa: 'ユニットテスト & V8 カバレッジダッシュボード (npm run test:unit)', titleEn: 'Unit Testing & V8 Coverage Dashboard (npm run test:unit)', type: 'Automated', command: 'npm run test:unit', procedureJa: 'Vitest によるフロントエンド網羅率計測（--coverage）および cargo test によるバックエンド全テストを実行。', expectedJa: 'フロントエンド 64+ テスト全パス（Statements 80% 達成、coverage/index.html 生成）、Rust 58 テスト全パス。' },
      { id: 'TC-INT-03', suiteId: 11, titleJa: 'Playwright 視覚的描画回帰テスト (npm run test:visual)', titleEn: 'Playwright Visual Regression Testing (npm run test:visual)', type: 'Automated', command: 'npm run test:visual', procedureJa: 'ヘッドレス Chromium で Canvas レイヤーのスナップショット比較を実行。Unicode プレースホルダー（U+10EEEE）、TUI プレビュー枠（Yazi/Ranger）、高電圧ネオンテーマを検証。', expectedJa: '未定義グリフ（豆腐文字 □）の非表示確認、TUI 枠線のズレ・文字消失ゼロ、高輝度ネオンテーマのコントラスト保持を確認。' },
      { id: 'TC-INT-04', suiteId: 11, titleJa: 'CDP メモリ & リソースリーク計測 (npm run test:memory)', titleEn: 'CDP Memory & Resource Leak Auditing (npm run test:memory)', type: 'Automated', command: 'npm run test:memory', procedureJa: 'Chrome DevTools Protocol を接続。10,000+ バッファ操作ストリーミング後およびタブ生成・破棄後のヒープと DOM ノード数を計測。', expectedJa: '大量ストリーミング後も JSHeap が 300MB 以内に抑制され、タブ破棄後の DOM ノード・Document 残存リークがゼロ（差分許容値内）に保たれる。' },
      { id: 'TC-INT-05', suiteId: 11, titleJa: '単一コマンド統合パイプライン & Lefthook Git 連動 (npm run test:all)', titleEn: 'Single-Command Orchestration & Lefthook Git Hooks (npm run test:all)', type: 'Automated', command: 'npm run test:all', procedureJa: 'npm run test:all を実行。Lefthook（pre-commit, commit-msg, pre-push）フックの動作を検証。', expectedJa: '全 4 レイヤーが順次完走して ALL PASS で終了。不正コミットやリグレッションのプッシュが機械的に遮断される。' },
      { id: 'TC-INT-06', suiteId: 11, titleJa: 'CommandPolicy 攻撃・誤検知検証コーパス (command_policy_corpus)', titleEn: 'CommandPolicy Attack & False-Positive Verification Corpus (command_policy_corpus)', type: 'Automated', command: 'cargo test --test command_policy_corpus', procedureJa: 'cargo test --test command_policy_corpus を実行（シェル間接実行、動的評価、パイプ迂回、特権昇格、難読化など 100+ パターンおよび日常の開発コマンド）。', expectedJa: '迂回試行が 100% 確実に Review または Block され、日常的な開発コマンド（git, npm, cargo, 破壊的単語を含む echo/cat）は 100% 確実に Safe と判定される。' }
    ];

    // State Management
    const STORAGE_KEY = 'waddle_test_plan_results_v1';
    let currentSuiteFilter = 0;
    let currentStatusFilter = 'all';
    let currentSearch = '';

    let state = {
      date: new Date().toISOString().split('T')[0],
      tester: 'Waddle Quality Assurance Team',
      environment: `Linux (${navigator.platform || 'x86_64'}, WebKitGTK / Webview, Node.js >= 20, Rust >= 1.75)`,
      overallResult: 'IN PROGRESS',
      results: {}
    };

    // Load from LocalStorage
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {
        console.error('Failed to load state from localStorage:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state to localStorage:', e);
      }
      updateStats();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function copyToClipboard(text, successMsg = 'クリップボードにコピーしました！') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(successMsg);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg);
      });
    }

    // Compute Stats
    function updateStats() {
      const total = TEST_CASES.length;
      let passed = 0;
      let failed = 0;
      let skipped = 0;

      for (const tc of TEST_CASES) {
        const res = state.results[tc.id]?.status;
        if (res === 'pass') passed++;
        else if (res === 'fail') failed++;
        else if (res === 'skip') skipped++;
      }

      const untested = total - (passed + failed + skipped);
      const rate = total > 0 ? Math.round((passed / total) * 100) : 0;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-passed').textContent = passed;
      document.getElementById('stat-failed').textContent = failed;
      document.getElementById('stat-skipped').textContent = skipped;
      document.getElementById('stat-untested').textContent = untested;
      document.getElementById('stat-rate').textContent = `${rate}%`;

      document.getElementById('bar-pass').style.width = `${(passed / total) * 100}%`;
      document.getElementById('bar-fail').style.width = `${(failed / total) * 100}%`;
      document.getElementById('bar-skip').style.width = `${(skipped / total) * 100}%`;
      document.getElementById('bar-untested').style.width = `${(untested / total) * 100}%`;

      // Auto update overall status if not manually locked
      const overallSelect = document.getElementById('overall-result');
      if (failed > 0) {
        state.overallResult = 'FAIL';
      } else if (passed === total) {
        state.overallResult = 'PASS';
      } else {
        state.overallResult = 'IN PROGRESS';
      }
      overallSelect.value = state.overallResult;

      // Update suite tab badges
      document.querySelectorAll('.suite-tab').forEach(tab => {
        const sId = parseInt(tab.dataset.suiteId, 10);
        const count = sId === 0 ? total : TEST_CASES.filter(c => c.suiteId === sId).length;
        const pCount = sId === 0 ? passed : TEST_CASES.filter(c => c.suiteId === sId && state.results[c.id]?.status === 'pass').length;
        const badge = tab.querySelector('.tab-badge');
        if (badge) {
          badge.textContent = `${pCount}/${count}`;
        }
      });
    }

    // Render Suite Tabs
    function renderSuiteTabs() {
      const container = document.getElementById('suite-tabs');
      container.innerHTML = '';

      TEST_SUITES.forEach(s => {
        const tab = document.createElement('div');
        tab.className = `suite-tab ${s.id === currentSuiteFilter ? 'active' : ''}`;
        tab.dataset.suiteId = s.id;
        tab.innerHTML = `<span>${s.nameJa}</span> <span class="tab-badge">0/0</span>`;
        tab.addEventListener('click', () => {
          currentSuiteFilter = s.id;
          document.querySelectorAll('.suite-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          renderTestList();
        });
        container.appendChild(tab);
      });
    }

    // Render Test Cards
    function renderTestList() {
      const container = document.getElementById('test-list');
      container.innerHTML = '';

      const searchLower = currentSearch.toLowerCase().trim();

      const filtered = TEST_CASES.filter(tc => {
        if (currentSuiteFilter !== 0 && tc.suiteId !== currentSuiteFilter) return false;
        const status = state.results[tc.id]?.status || 'untested';
        if (currentStatusFilter !== 'all' && status !== currentStatusFilter) return false;

        if (searchLower) {
          const matchId = tc.id.toLowerCase().includes(searchLower);
          const matchTitle = tc.titleJa.toLowerCase().includes(searchLower) || tc.titleEn.toLowerCase().includes(searchLower);
          const matchProc = tc.procedureJa.toLowerCase().includes(searchLower);
          const matchExp = tc.expectedJa.toLowerCase().includes(searchLower);
          return matchId || matchTitle || matchProc || matchExp;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 48px; color: var(--text-muted); background: var(--bg-card); border-radius: 12px;">
            条件に一致するテストケースが見つかりませんでした。
          </div>
        `;
        return;
      }

      filtered.forEach(tc => {
        const res = state.results[tc.id] || { status: 'untested', note: '' };
        const statusClass = `status-${res.status}`;

        const card = document.createElement('div');
        card.className = `test-card ${statusClass}`;
        card.id = `card-${tc.id}`;

        const isAuto = tc.type.includes('Automated') || tc.type.includes('Scripted');

        card.innerHTML = `
          <div class="card-top">
            <div class="card-title-group">
              <span class="tc-id">${tc.id}</span>
              <span class="tc-type ${isAuto ? 'automated' : ''}">${tc.type}</span>
              <span class="tc-title">${tc.titleJa}</span>
              <span class="tc-title-en">(${tc.titleEn})</span>
            </div>
            <div class="status-buttons">
              <button class="status-btn ${res.status === 'pass' ? 'active-pass' : ''}" data-status="pass">🟢 合格</button>
              <button class="status-btn ${res.status === 'fail' ? 'active-fail' : ''}" data-status="fail">🔴 不合格</button>
              <button class="status-btn ${res.status === 'skip' ? 'active-skip' : ''}" data-status="skip">🟡 保留</button>
              <button class="status-btn ${res.status === 'untested' ? 'active-untested' : ''}" data-status="untested">⚪ 未検証</button>
            </div>
          </div>

          <div class="card-body-grid">
            <div class="grid-col">
              <span class="grid-col-label">検証手順 (Procedure)</span>
              <div class="grid-col-content">${tc.procedureJa}</div>
              ${tc.command ? `
                <div class="command-box">
                  <span class="command-text">${tc.command}</span>
                  <button class="btn-copy" data-copy="${encodeURIComponent(tc.command)}">📋 コピー</button>
                </div>
              ` : ''}
            </div>
            <div class="grid-col">
              <span class="grid-col-label">期待される結果 (Expected)</span>
              <div class="grid-col-content">${tc.expectedJa}</div>
            </div>
          </div>

          <div class="note-row">
            <input type="text" class="note-input" placeholder="エビデンスメモ・特記事項・ログ (任意)..." value="${(res.note || '').replace(/"/g, '&quot;')}">
          </div>
        `;

        // Event listeners for status buttons
        card.querySelectorAll('.status-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const newStatus = btn.dataset.status;
            if (!state.results[tc.id]) state.results[tc.id] = { status: 'untested', note: '' };
            state.results[tc.id].status = newStatus;
            saveState();
            renderTestList();
          });
        });

        // Event listener for note input
        const noteInput = card.querySelector('.note-input');
        noteInput.addEventListener('input', (e) => {
          if (!state.results[tc.id]) state.results[tc.id] = { status: 'untested', note: '' };
          state.results[tc.id].note = e.target.value;
          saveState();
        });

        // Copy button
        const copyBtn = card.querySelector('.btn-copy');
        if (copyBtn) {
          copyBtn.addEventListener('click', () => {
            const cmd = decodeURIComponent(copyBtn.dataset.copy);
            copyToClipboard(cmd, `コマンドをコピーしました: ${cmd}`);
          });
        }

        container.appendChild(card);
      });
    }

    // Generate Markdown Report
    function generateMarkdown() {
      const totalCases = TEST_CASES.length;
      let passed = 0;
      let failed = 0;
      let skipped = 0;

      for (const tc of TEST_CASES) {
        const res = state.results[tc.id]?.status;
        if (res === 'pass') passed++;
        else if (res === 'fail') failed++;
        else if (res === 'skip') skipped++;
      }
      const untested = totalCases - (passed + failed + skipped);

      const suiteRows = TEST_SUITES.filter(s => s.id > 0).map(suite => {
        const cases = TEST_CASES.filter(c => c.suiteId === suite.id);
        const pCount = cases.filter(c => state.results[c.id]?.status === 'pass').length;
        const fCount = cases.filter(c => state.results[c.id]?.status === 'fail').length;
        const notes = fCount > 0 ? `${fCount} 件の不合格あり` : '全項目合格確認済';
        return `| ${suite.nameJa} | ${cases.length} | ${pCount} | ${fCount} | ${notes} |`;
      }).join('\n');

      let md = `### テスト実行記録 (Test Execution Evidence)
- **実行日**: ${state.date}
- **テスター**: ${state.tester || 'Waddle Quality Assurance Team'}
- **環境**: ${state.environment}
- **総合判定**: **[${state.overallResult}]** (合格: ${passed} / 不合格: ${failed} / 保留・スキップ: ${skipped} / 未検証: ${untested})

| スイート | 項目数 | 合格数 | 不合格数 | 備考 |
| :--- | :--- | :--- | :--- | :--- |
${suiteRows}

### 詳細エビデンス & 特記事項

| ID | テスト対象 | 判定 | 種別 | エビデンス・特記事項 |
| :--- | :--- | :--- | :--- | :--- |
`;

      const activeCases = TEST_CASES.filter(tc => {
        const r = state.results[tc.id];
        return r && (r.status === 'pass' || r.status === 'fail' || (r.note && r.note.trim().length > 0));
      });

      if (activeCases.length > 0) {
        for (const tc of activeCases) {
          const res = state.results[tc.id];
          const icon = res.status === 'pass' ? '🟢 PASS' : res.status === 'fail' ? '🔴 FAIL' : res.status === 'skip' ? '🟡 SKIP' : '⚪ PENDING';
          const safeNote = (res.note || '').replace(/\|/g, '\\|').replace(/\n/g, '<br/>') || '-';
          md += `| **${tc.id}** | ${tc.titleJa} | ${icon} | ${tc.type} | ${safeNote} |\n`;
        }
      } else {
        md += `_特記事項なし_\n`;
      }

      return md;
    }

    // Initialization
    window.addEventListener('DOMContentLoaded', () => {
      loadState();

      // Bind Meta
      const dateEl = document.getElementById('exec-date');
      const testerEl = document.getElementById('tester-name');
      const envEl = document.getElementById('env-info');
      const overallEl = document.getElementById('overall-result');

      dateEl.value = state.date;
      testerEl.value = state.tester;
      envEl.value = state.environment;
      overallEl.value = state.overallResult;

      dateEl.addEventListener('change', (e) => { state.date = e.target.value; saveState(); });
      testerEl.addEventListener('input', (e) => { state.tester = e.target.value; saveState(); });
      envEl.addEventListener('input', (e) => { state.environment = e.target.value; saveState(); });
      overallEl.addEventListener('change', (e) => { state.overallResult = e.target.value; saveState(); });

      // Search
      document.getElementById('search-input').addEventListener('input', (e) => {
        currentSearch = e.target.value;
        renderTestList();
      });

      // Mark all filtered pass
      document.getElementById('btn-mark-all-pass').addEventListener('click', () => {
        const searchLower = currentSearch.toLowerCase().trim();
        TEST_CASES.forEach(tc => {
          if (currentSuiteFilter !== 0 && tc.suiteId !== currentSuiteFilter) return;
          if (searchLower) {
            const match = tc.id.toLowerCase().includes(searchLower) || tc.titleJa.toLowerCase().includes(searchLower);
            if (!match) return;
          }
          if (!state.results[tc.id]) state.results[tc.id] = { status: 'untested', note: '' };
          state.results[tc.id].status = 'pass';
        });
        saveState();
        renderTestList();
        showToast('表示中の全項目を「合格」に更新しました');
      });

      // Reset all
      document.getElementById('btn-reset-all').addEventListener('click', () => {
        if (confirm('すべてのテスト判定とメモを初期化（リセット）しますか？')) {
          state.results = {};
          saveState();
          renderTestList();
          showToast('全テスト結果をリセットしました');
        }
      });

      // Export Markdown Modal
      const mdModal = document.getElementById('md-modal');
      const mdPreview = document.getElementById('md-preview-text');

      document.getElementById('btn-export-md').addEventListener('click', () => {
        mdPreview.value = generateMarkdown();
        mdModal.classList.add('active');
      });

      document.getElementById('btn-close-modal').addEventListener('click', () => {
        mdModal.classList.remove('active');
      });

      document.getElementById('btn-copy-md').addEventListener('click', () => {
        copyToClipboard(mdPreview.value, 'Markdown レポートをクリップボードにコピーしました！');
      });

      document.getElementById('btn-download-md').addEventListener('click', () => {
        const blob = new Blob([mdPreview.value], { type: 'text/markdown;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `WADDLE_TEST_REPORT_${state.date}.md`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Markdown レポートをダウンロードしました');
      });

      // JSON Export & Import
      document.getElementById('btn-export-json').addEventListener('click', () => {
        const jsonStr = JSON.stringify(state, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `waddle_test_results_${state.date}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('JSON データを保存しました');
      });

      const fileInput = document.getElementById('json-file-input');
      document.getElementById('btn-import-json').addEventListener('click', () => {
        fileInput.click();
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            state = { ...state, ...parsed };
            saveState();
            dateEl.value = state.date;
            testerEl.value = state.tester;
            envEl.value = state.environment;
            overallEl.value = state.overallResult;
            renderTestList();
            showToast('JSON データを正常に復元しました！');
          } catch (err) {
            alert('JSON ファイルの読み込みに失敗しました: ' + err.message);
          }
        };
        reader.readAsText(file);
      });

      renderSuiteTabs();
      renderTestList();
      updateStats();
    });
  </script>
</body>
</html>
